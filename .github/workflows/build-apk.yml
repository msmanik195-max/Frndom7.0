name: Build APK

on:
  push:
    branches:
      - '**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      # মিসিং ডিবাগ কিস্টোর তৈরি
      - name: Generate Debug Keystore
        run: |
          keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"

      # google-services.json তৈরি
      - name: Create google-services.json
        run: |
          mkdir -p app
          cat << 'EOF' > app/google-services.json
          {
            "project_info": {
              "project_number": "811952393925",
              "firebase_url": "https://frndom-871ec-default-rtdb.firebaseio.com",
              "project_id": "frndom-871ec",
              "storage_bucket": "frndom-871ec.firebasestorage.app"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:811952393925:android:4755f7334040c07c702aac",
                  "android_client_info": {
                    "package_name": "com.frndom"
                  }
                },
                "oauth_client": [],
                "api_key": [
                  {
                    "current_key": "AIzaSyDIyVBiQKM9sFaOie1Mabvx6uWIq_5G2g4"
                  }
                ],
                "services": {
                  "appinvite_service": {
                    "other_platform_oauth_client": []
                  }
                }
              }
            ],
            "configuration_version": "1"
          }
          EOF

      # গ্র্যাডেল র‍্যাপার জেনারেট
      - name: Setup Gradle Wrapper
        run: |
          gradle wrapper
          chmod +x gradlew

      # কম্পোজ ও কোটলিন কম্পাইলারের অমিল বাইপাস করে বিল্ড
      - name: Build Debug APK
        run: ./gradlew assembleDebug -Dorg.gradle.project.kotlin.compiler.execution.strategy="in-process" --no-daemon

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: App-Debug-APK
          path: app/build/outputs/apk/debug/*.apk
